<style>

:root{
 --bg:#f4f1ea; --card:#e9e5dc; --card2:#ddd8cd;
 --fg:#202923; --dim:#59635b; --dim2:#7d867e;
 --ac:#007aff; --acq:rgba(0,122,255,.12);
 --line:#c4c8be; --sh:rgba(0,0,0,.09);
 --navh:56px;
 --tile:#1b2231; --tile2:#28324a;
 --tilent:#1d2f34; --tilent2:#2a4249;
 --law:linear-gradient(145deg,#5b5bd6,#7c3aed);
 --history:linear-gradient(145deg,#0d9488,#0891b2);
 --wisdom:linear-gradient(145deg,#d97706,#ea580c);
 --prophets:linear-gradient(145deg,#e11d48,#be123c);
 --gospels:linear-gradient(145deg,#2563eb,#1d4ed8);
 --letters:linear-gradient(145deg,#059669,#047857);
 --revelation:linear-gradient(145deg,#7e22ce,#a21caf);
 --lawc:#6d3fe0; --historyc:#0d9488; --wisdomc:#d97706;
 --prophetsc:#e11d48; --gospelsc:#2563eb; --lettersc:#059669; --revelationc:#9333ea;
}
:root[data-theme="dark"]{
 --bg:#121614; --card:#1b201d; --card2:#252b27;
 --fg:#f1eee5; --dim:#abaea7; --dim2:#8a8e86;
 --ac:#0a84ff; --acq:rgba(10,132,255,.22);
 --line:#3b423c; --sh:rgba(0,0,0,.6);
 --lawc:#a78bfa; --historyc:#2dd4bf; --wisdomc:#fbbf24;
 --prophetsc:#fb7185; --gospelsc:#60a5fa; --lettersc:#34d399; --revelationc:#d8b4fe;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
 font-size:18px;line-height:1.5;overflow-x:clip;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}

.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);
 backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);
 padding:9px 20px;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.topin{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:38px}
.back{display:flex;align-items:center;gap:3px;font-size:17px;color:var(--ac);margin-left:-6px}

.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.brand{font-size:16px;font-weight:600;letter-spacing:-.2px;color:var(--dim);flex:1}
.tt{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.tt svg{width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:1.9;stroke-linecap:round}
</style>

<div class="top"><div class="topin">
  <button class="back" id="back" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span id="backlab">Books</span></button>

<script src="data/about.js"></script>
<script>
const CSS = `
.hub{padding:16px 0 56px}
.grp{margin-top:26px}
.grp:first-child{margin-top:8px}
.grp h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
 color:var(--dim2);margin:0 0 12px}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:540px){.bgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:700px){.bgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.book-cover{position:relative;height:88px;width:100%;background:#25322e;
 border:1px solid #65736a;border-radius:7px;display:flex;align-items:center;
 justify-content:center;padding:8px;box-shadow:0 3px 7px #00000014;
 transition:transform .12s ease,filter .15s ease}
.book-cover:active{transform:scale(.98)}
.book-cover:hover{filter:brightness(1.18)}
.book-cover::before{content:'';position:absolute;left:6px;top:10px;bottom:10px;
 width:1px;background:#ffffff0d}
.book-cover::after{content:'';position:absolute;top:10px;left:calc(50% - 13px);
 width:26px;height:1px;background:#c5ac78}
.book-name{color:#f4efdf;text-align:center;font:400 16px/1.25 Inter,Arial,sans-serif;
 margin:0;white-space:nowrap;transform:translateY(-3px)}
.book-family{position:absolute;left:8px;right:8px;bottom:7px;color:#c5c9bd;
 text-align:center;font:400 9px/1.2 Inter,Arial,sans-serif;letter-spacing:.5px}
.book-cover.history{background:#2d3432;border-color:#707c75}
.book-cover.poetry{background:#34312c;border-color:#777165}
.book-cover.gospel{background:#29333c;border-color:#697782}
.book-cover.letter{background:#332f3a;border-color:#7a6f83}
.book-cover.prophecy{background:#3b2f2e;border-color:#856c66}
.testa{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
 color:var(--dim2);margin:26px 0 12px}
.testa:first-of-type{margin-top:10px}

.vw{display:flex;background:var(--card);border-radius:11px;padding:3px;margin:4px 0 6px}
.vw button{flex:1;padding:10px 6px;border-radius:8px;font-size:14px;font-weight:500;
 color:var(--fg);text-align:center;white-space:nowrap}
.vw button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 3px var(--sh)}
:root[data-theme="dark"] .vw button.on{background:var(--card2)}

.bhead{padding:24px 0 14px}
.bhead h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.9px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px;padding-bottom:56px}
.ctile{aspect-ratio:1;border-radius:7px;background:#25322e;border:1px solid #65736a;
 color:#f4efdf;display:grid;place-items:center;
 font:400 17px/1 Inter,Arial,sans-serif;
 transition:transform .12s ease,filter .15s ease}
.ctile:active{transform:scale(.94)}
.ctile:hover{filter:brightness(1.18)}
.ctile.history{background:#2d3432;border-color:#707c75}
.ctile.poetry{background:#34312c;border-color:#777165}
.ctile.gospel{background:#29333c;border-color:#697782}
.ctile.letter{background:#332f3a;border-color:#7a6f83}
.ctile.prophecy{background:#3b2f2e;border-color:#856c66}

.tabs{display:flex;background:var(--card);border-radius:11px;padding:3px;margin:2px 0 14px}
.tabs button{flex:1;padding:10px 6px;border-radius:8px;font-size:14px;font-weight:500;
 color:var(--fg);text-align:center}
.tabs button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 3px var(--sh)}
:root[data-theme="dark"] .tabs button.on{background:var(--card2)}
.modes{display:flex;gap:7px;margin:0 0 12px}
.modes button{font-size:13px;padding:7px 14px;border-radius:999px;
 background:var(--card);color:var(--dim)}
.modes button.on{background:var(--card2);color:var(--fg);font-weight:500}
.facts{margin:0;padding:0 0 60px}
.fact{display:grid;grid-template-columns:124px 1fr;gap:16px;padding:12px 0;
 border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact .k{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
 color:var(--dim2);padding-top:4px}
.fact .v{font-size:16px;line-height:1.55}
@media(max-width:520px){.fact{grid-template-columns:1fr;gap:3px}
 .fact .k{padding-top:0}}

.chead{padding:22px 0 2px}
.chead h1{margin:0;font-size:31px;font-weight:700;letter-spacing:-.7px}
.player{position:sticky;top:var(--navh);z-index:30;background:var(--card);
 border-radius:16px;padding:12px 16px;margin:16px 0 8px}
.prow{display:flex;align-items:center;gap:14px}
.play{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.play svg{width:22px;height:22px;fill:#fff;margin-left:2px}
.play.playing svg{margin-left:0}
.ptime{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:104px;text-align:right}
.bar{flex:1;height:34px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bartrack{width:100%;height:5px;border-radius:3px;background:var(--card2);position:relative}
.barfill{position:absolute;inset:0 auto 0 0;background:var(--ac);border-radius:3px;width:0}
.barknob{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:#fff;
 transform:translate(-50%,-50%);left:0;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.player::before{content:'';position:absolute;left:-21px;right:-21px;top:-18px;
 height:19px;background:var(--bg)}
.skips{display:flex;gap:10px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.skips .flw{background:var(--acq);box-shadow:inset 0 0 0 1px var(--ac)}
:root[data-theme="dark"] .skips .flw{background:var(--acq)}
.skips .flw.off{background:var(--bg);box-shadow:none;opacity:.55}
:root[data-theme="dark"] .skips .flw.off{background:var(--card2)}
.jump{position:fixed;left:50%;transform:translateX(-50%);z-index:50;
 bottom:calc(20px + env(safe-area-inset-bottom,0px));
 background:var(--ac);color:#fff;font-size:14px;font-weight:500;
 padding:11px 19px;border-radius:999px;display:flex;align-items:center;gap:7px;
 box-shadow:0 8px 24px rgba(0,0,0,.4)}
.jump[hidden]{display:none}
.jump svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;
 stroke-linecap:round;stroke-linejoin:round}
.skips button{font-size:14px;color:var(--ac);padding:6px 15px;border-radius:999px;background:var(--bg);font-weight:500}
:root[data-theme="dark"] .skips button{background:var(--card2)}

.body{padding:10px 0 60vh}
.sent{display:flex;align-items:flex-start;gap:2px;border-radius:10px;width:100%;
 transition:background .15s ease}
.seek{flex:1;display:flex;gap:12px;align-items:flex-start;padding:7px 4px 7px 10px;
 border-radius:10px;text-align:left}
.sent .v{flex:0 0 46px;text-align:right;font-size:13px;font-weight:700;color:var(--dim2);
 padding-top:5px;font-variant-numeric:tabular-nums}
.sent .tx{flex:1;font-size:19px;line-height:1.62;letter-spacing:-.2px}
.sent.on{background:var(--acq)}
.sent.on .tx{font-weight:500}
.sent.done .tx{color:var(--dim)}
.favpad{flex:0 0 36px}
.fav{flex:0 0 36px;height:36px;margin-top:3px;display:grid;place-items:center;
 border-radius:50%;opacity:.22;transition:opacity .15s ease}
.sent:hover .fav{opacity:.55}
.fav.faved,.sent:hover .fav.faved{opacity:1}
.fav svg{width:17px;height:17px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linejoin:round}
.fav.faved svg{fill:#e0555f;stroke:#e0555f}

.feed{padding:6px 0 60px}
.fcard{border-top:1px solid var(--line);padding:16px 0}
.fcard:first-child{border-top:0}
.fsrc{font-size:13px;color:var(--dim2);margin-bottom:6px}
.ftx{font-size:17.5px;line-height:1.55}
.frow{display:flex;align-items:center;gap:10px;margin-top:10px}
.fts{font-size:13px;font-weight:600;color:var(--ac);background:var(--acq);
 padding:5px 11px;border-radius:7px;font-variant-numeric:tabular-nums}
.fdel{font-size:13px;color:var(--dim2);padding:5px 10px;border-radius:7px}
.fhead{padding:22px 0 6px}
.fhead h1{margin:0;font-size:31px;font-weight:700;letter-spacing:-.7px}
.jump{display:flex;gap:8px;margin:14px 0 2px}
.jump input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;
 border:0;background:var(--card);color:var(--fg);outline:none}
.note{color:var(--dim);font-size:14px;padding:10px 0 0}
`;
const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);

const $ = s => document.querySelector(s), app = $('#app');
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt = s => {s=Math.max(0,Math.round(s));const m=Math.floor(s/60);
  return m+':'+String(s%60).padStart(2,'0')};
const BY = {}; BIBLE.forEach(b => BY[b.s] = b);

const HEART = 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z';
// keyed on the sentence start time, which survives a data rebuild; index would not
let favs = LS.get('msg_favs', []);
const fkey = (s, c, t) => s + '/' + c + '/' + Number(t).toFixed(2);
const isFav = (s, c, t) => favs.some(f => f.k === fkey(s, c, t));
function toggleFav(b, n, row, text){
  const k = fkey(b.s, n, row[0]);
  const at = favs.findIndex(f => f.k === k);
  if (at >= 0) favs.splice(at, 1);
  else favs.push({k, s: b.s, c: n, t: row[0], v: row[2] || '', x: text || row[1], w: Date.now()});
  LS.set('msg_favs', favs);
  return at < 0;
}

const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
const MOON='<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/>';
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);
  $('#ttsvg').innerHTML = t==='dark'?SUN:MOON;
  $('#tcolor').setAttribute('content', t==='dark'?'#121614':'#f4f1ea');}
let theme = LS.get('msg_theme','dark'); applyTheme(theme);
$('#tt').onclick = () => {theme = theme==='dark'?'light':'dark'; LS.set('msg_theme',theme); applyTheme(theme);};
$('#favbtn').onclick = () => location.hash = '#favs';

const GROUPS = [["law","Law"],["history","History"],["wisdom","Wisdom"],
  ["prophets","Prophets"],["gospels","Gospels & Acts"],["letters","Letters"],
  ["revelation","Revelation"]];

let audio = new Audio(), curKey = null, cur = null, draw = () => {}, icon = () => {};
let srcs = [], si = 0, lastT = 0, srcLabel = '', seekTo = null;

/* keep the line that is playing on screen */
let follow = LS.get('msg_follow', true), adrift = false, firstJump = true,
    userAt = 0, sentEls = [], activeIdx = -1;
const onChapter = () => !!document.getElementById('jump');
function bandTop(){
  const t = document.querySelector('.top'), pl = document.querySelector('.player');
  return (t ? t.offsetHeight : 0) + (pl ? pl.offsetHeight : 0) + 14;
}
function inBand(){
  const n = sentEls[activeIdx]; if (!n) return false;
  const rc = n.getBoundingClientRect(), head = bandTop();
  return rc.top >= head - 2 && rc.bottom <= innerHeight - 88;
}
function scrollToActive(smooth){
  const n = sentEls[activeIdx]; if (!n) return;
  const head = bandTop();
  const y = Math.max(0, scrollY + n.getBoundingClientRect().top -
                        (head + (innerHeight - head) * 0.22));
  // a long jump (a seek, or opening a chapter part-way in) lands instantly;
  // a line-to-line advance glides
  const far = Math.abs(y - scrollY) > innerHeight * 1.6;
  scrollTo({top: y, behavior: (smooth && !far) ? 'smooth' : 'auto'});
}
function showJump(on){ const j = document.getElementById('jump'); if (j) j.hidden = !on; }
function keepVisible(){
  if (!follow || !onChapter() || activeIdx < 0 || !sentEls[activeIdx]) return;
  if (adrift){ if (inBand()){ adrift = false; showJump(false); } else showJump(true); return; }
  if (!inBand()) scrollToActive(!firstJump);
  firstJump = false;
}
function setFollow(on){
  follow = on; adrift = false; LS.set('msg_follow', on);
  const f = document.getElementById('flw');
  if (f){ f.classList.toggle('off', !on); f.textContent = on ? 'Following' : 'Follow';
          f.setAttribute('aria-pressed', String(on)); }
  showJump(false);
  if (on) scrollToActive(true);
}
addEventListener('wheel', () => { userAt = Date.now(); }, {passive: true});
addEventListener('touchmove', () => { userAt = Date.now(); }, {passive: true});
addEventListener('scroll', () => {
  if (!follow || !onChapter() || activeIdx < 0 || !sentEls[activeIdx]) return;
  if (Date.now() - userAt > 1200) return;
  if (!inBand()){ if (!adrift){ adrift = true; showJump(true); } }
  else if (adrift){ adrift = false; showJump(false); }
}, {passive: true});

function srcList(d){
  const out = [d.a];
  if (d.g){
    out.push('https://drive.google.com/uc?export=download&id=' + d.g);
    out.push('https://drive.usercontent.google.com/download?id=' + d.g + '&export=download');
    out.push('https://drive.google.com/uc?export=open&id=' + d.g);
  }
  return out;
}

function setChapterAudio(d){
  srcs = srcList(d); si = 0; lastT = 0;
  srcLabel = '';
  audio.src = srcs[0];
  audio.load();
}

// if a source fails, walk to the next one and pick up where we were
audio.addEventListener('error', () => {
  if (si + 1 >= srcs.length) return;
  si++;
  const t = lastT, wasPlaying = !audio.paused;
  srcLabel = si > 0 ? 'Drive' : '';
  audio.src = srcs[si];
  audio.load();
  audio.addEventListener('loadedmetadata', () => {
    if (t > 0) audio.currentTime = t;
    if (wasPlaying) audio.play().catch(() => {});
    const tag = document.getElementById('srctag');
    if (tag) tag.textContent = srcLabel;
  }, {once: true});
});

function setNav(backTo, label, brand){
  const b = $('#back');
  b.hidden = !backTo;
  if (backTo){ $('#backlab').textContent = label; b.onclick = () => location.hash = backTo; }
  $('#brand').textContent = brand;
}

const VIEWS = [['order','Bible Order'],['az','Alphabetical'],['type','By Type']];
let view = LS.get('msg_view', 'order');

BIBLE.forEach((b, i) => b.nt = i >= 39);   // Matthew onward

// card class + the label printed under the title
const CAT = {
  law:        ['',          'LAW'],
  history:    ['history',   'HISTORY'],
  wisdom:     ['poetry',    'WISDOM'],
  prophets:   ['prophecy',  'PROPHECY'],
  gospels:    ['gospel',    'GOSPEL'],
  letters:    ['letter',    'LETTER'],
  revelation: ['prophecy',  'PROPHECY']
};
const POETRY = new Set(['Psalms', 'Song of Songs', 'Lamentations']);
function cat(b){
  let [cls, tag] = CAT[b.g] || ['', 'LAW'];
  if (POETRY.has(b.n)) { cls = 'poetry'; tag = 'POETRY'; }
  if (b.n === 'Acts')  { cls = 'history'; tag = 'HISTORY'; }
  return [cls, tag];
}
BIBLE.forEach(b => { const [c, t] = cat(b); b.cls = c; b.tag = t; });

function tile(b){
  return `<button class="book-cover ${b.cls}" data-b="${b.s}" aria-label="${b.n}, ${b.tag}">
    <span class="book-name">${b.n}</span><span class="book-family">${b.tag}</span></button>`;
}

function books(){
  setNav(null, '', 'The Message');
  const last = LS.get('msg_last', null);
  let html = '<div class="hub">';
  html += '<div class="vw">' + VIEWS.map(([k, label]) =>
    `<button data-v="${k}" class="${view === k ? 'on' : ''}">${label}</button>`).join('') + '</div>';
  html += '<div class="jump"><input id="jq" placeholder="Jump to a chapter — try John 3" autocomplete="off"></div>';
  if (last && BY[last.s]) html += `<div class="note">Last played: <a href="#c/${last.s}/${last.c}">${BY[last.s].n} ${last.c}</a></div>`;

  if (view === 'type'){
    GROUPS.forEach(([g, label]) => {
      const list = BIBLE.filter(b => b.g === g);
      if (!list.length) return;
      html += `<div class="grp"><h2>${label}</h2><div class="bgrid">` +
        list.map(tile).join('') + '</div></div>';
    });
  } else if (view === 'az'){
    const list = [...BIBLE].sort((a, b) => a.n.localeCompare(b.n, undefined, {numeric: true}));
    html += '<div class="grp"><div class="bgrid">' + list.map(tile).join('') + '</div></div>';
  } else {
    html += '<div class="testa">Old Testament</div><div class="bgrid">' +
      BIBLE.filter(b => !b.nt).map(tile).join('') + '</div>';
    html += '<div class="testa">New Testament</div><div class="bgrid">' +
      BIBLE.filter(b => b.nt).map(tile).join('') + '</div>';
  }

  app.innerHTML = html + '</div>';
  app.querySelectorAll('[data-v]').forEach(el => el.onclick = () => {
    view = el.dataset.v; LS.set('msg_view', view); books();
  });
  app.querySelectorAll('[data-b]').forEach(el => el.onclick = () => location.hash = '#b/' + el.dataset.b);
  const q = $('#jq');
  if (q) q.addEventListener('keydown', e => { if (e.key === 'Enter') doJump(q.value); });
}

function doJump(s){
  s = (s || '').trim(); if (!s) return;
  const m = s.match(/^(.*?)[\s.:]*(\d+)?$/); if (!m) return;
  const name = (m[1] || '').toLowerCase().replace(/\s+/g,' ').trim();
  const ch = parseInt(m[2] || '1', 10);
  if (!name) return;
  let hit = BIBLE.find(b => b.n.toLowerCase() === name) ||
            BIBLE.find(b => b.s === name) ||
            BIBLE.find(b => b.n.toLowerCase().startsWith(name)) ||
            BIBLE.find(b => b.n.toLowerCase().replace(/\s/g,'').startsWith(name.replace(/\s/g,'')));
  if (!hit) return;
  location.hash = '#c/' + hit.s + '/' + Math.min(Math.max(1, ch), hit.c);
}

const FIELDS = [['au','Author'],['wr','Written'],['to','Written for'],['ge','Type'],
  ['se','Setting'],['th','Themes'],['kf','Key figures'],['kn','Known for'],['su','In a line']];
let tab = 'chapters';
let mode = LS.get('msg_mode', 'b');          // b = both views, o = Orthodox
const pick = v => typeof v === 'string' ? v : (mode === 'o' ? v.o : v.b);

function book(slug){
  const b = BY[slug]; if (!b) return books();
  setNav('#', 'Books', b.n);
  const a = ABOUT[b.s];
  let html = `<div class="bhead"><h1>${b.n}</h1></div>`;
  if (a) html += `<div class="tabs">
      <button data-t="chapters" class="${tab === 'chapters' ? 'on' : ''}">Chapters</button>
      <button data-t="about" class="${tab === 'about' ? 'on' : ''}">About</button></div>`;

  if (a && tab === 'about'){
    html += `<div class="modes">
      <button data-m="b" class="${mode === 'b' ? 'on' : ''}">Both views</button>
      <button data-m="o" class="${mode === 'o' ? 'on' : ''}">Orthodox</button></div>`;
    html += '<div class="facts">' + FIELDS.map(([k, label]) =>
      `<div class="fact"><div class="k">${label}</div><div class="v">${pick(a[k])}</div></div>`
      ).join('') + '</div>';
  } else {
    html += '<div class="cgrid">';
    for (let i = 1; i <= b.c; i++)
      html += `<button class="ctile ${b.cls}" data-c="${i}">${i}</button>`;
    html += '</div>';
  }

  app.innerHTML = html;
  app.querySelectorAll('[data-t]').forEach(el => el.onclick = () => {
    tab = el.dataset.t; book(slug);
  });
  app.querySelectorAll('[data-m]').forEach(el => el.onclick = () => {
    mode = el.dataset.m; LS.set('msg_mode', mode); book(slug);
  });
  app.querySelectorAll('[data-c]').forEach(el => {
    el.onclick = () => location.hash = '#c/' + slug + '/' + el.dataset.c;
  });
}

let pending = null;
function CH(data){ if (pending) pending(data); }

function favsView(){
  setNav('#', 'Books', 'Favorites');
  const list = [...favs].sort((a, b) => b.w - a.w);
  let html = '<div class="fhead"><h1>Favorites</h1></div>';
  if (!list.length){
    html += '<div class="note">Nothing saved yet. Tap the heart beside any verse while you read.</div>';
    app.innerHTML = html;
    return;
  }
  html += '<div class="feed">' + list.map(f => {
    const b = BY[f.s];
    const ref = (b ? b.n : f.s) + ' ' + f.c + (f.v ? ':' + f.v : '');
    return `<div class="fcard">
      <div class="fsrc">${ref}</div>
      <div class="ftx">${esc(f.x)}</div>
      <div class="frow">
        <button class="fts" data-go="${f.s}|${f.c}|${f.t}">Play from ${fmt(f.t)}</button>
        <button class="fdel" data-drop="${f.k}">Remove</button>
      </div></div>`;
  }).join('') + '</div>';
  app.innerHTML = html;
  app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => {
    const [s, c, t] = el.dataset.go.split('|');
    location.hash = '#c/' + s + '/' + c + '/' + t;
  });
  app.querySelectorAll('[data-drop]').forEach(el => el.onclick = () => {
    favs = favs.filter(f => f.k !== el.dataset.drop);
    LS.set('msg_favs', favs);
    favsView();
  });
}

function chapter(slug, n, at){
  const b = BY[slug]; if (!b) return books();
  n = Math.min(Math.max(1, parseInt(n, 10) || 1), b.c);
  seekTo = at != null ? parseFloat(at) : null;
  setNav('#b/' + slug, b.n, b.n + ' ' + n);
  app.innerHTML = '<div class="note">Loading…</div>';
  LS.set('msg_last', {s: slug, c: n});
  const key = slug + '/' + n;
  pending = d => { pending = null; render(b, n, d, key); };
  const s = document.createElement('script');
  s.src = 'data/' + slug + '/' + n + '.js?' + Date.now();
  s.onerror = () => { app.innerHTML = '<div class="note">Could not load this chapter.</div>'; };
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 2000);
}

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render(b, n, d, key){
  cur = d;
  // the heart belongs to the verse group, so only rows that open one get it
  const rows = d.s.map((r, i) => {
    const lab = r[2] || '';
    const heart = lab
      ? `<button class="fav${isFav(b.s, n, r[0]) ? ' faved' : ''}" data-fav="${i}"
           aria-label="Favorite ${b.n} ${n}:${lab}"><svg viewBox="0 0 24 24"><path d="${HEART}"/></svg></button>`
      : '<div class="favpad"></div>';
    return `<div class="sent" data-i="${i}">
       <button class="seek" data-t="${r[0]}">
         <span class="v">${lab}</span>
         <span class="tx">${esc(r[1])}</span></button>
       ${heart}</div>`;
  }).join('');
  const prev = n > 1 ? `<button class="skips" style="display:inline" data-go="${n-1}"></button>` : '';
  app.innerHTML = `<div class="chead"><h1>${b.n} ${n}</h1></div>
  <div class="player">
    <div class="prow">
      <button class="play" id="pp"><svg id="ppi" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="bar" id="bar"><div class="bartrack"><div class="barfill" id="fill"></div><div class="barknob" id="knob"></div></div></div>
      <div class="ptime"><span id="ptime">0:00 / ${fmt(d.d)}</span><span id="srctag" style="display:block;font-size:11px;color:var(--dim2)">${srcLabel}</span></div>
    </div>
    <div class="skips">
      <button data-sk="-15">&minus;15s</button>
      <button data-sk="15">+15s</button>
      <button id="rate">1&times;</button>
      <button id="flw" class="flw">Following</button>
      ${n > 1 ? `<button data-nav="${n-1}">Prev</button>` : ''}
      ${n < b.c ? `<button data-nav="${n+1}">Next</button>` : ''}
    </div>
  </div>
  <div class="body" id="body">${rows}</div>
  <button class="jump" id="jump" hidden><svg viewBox="0 0 24 24">
    <path d="M12 5v14M6 13l6 6 6-6"/></svg>Jump to current verse</button>`;

  if (curKey !== key){
    audio.pause();
    audio.preload = 'metadata';
    setChapterAudio(d);
    curKey = key;
  }
  wire(b, n, d);
}

function wire(b, n, d){
  const pp = $('#pp'), ppi = $('#ppi'), fill = $('#fill'), knob = $('#knob'),
        bar = $('#bar'), pt = $('#ptime'), rate = $('#rate'), body = $('#body');
  const PL = 'M8 5v14l11-7z', PA = 'M7 5h3.6v14H7zM13.4 5H17v14h-3.6z';
  const sents = [...body.querySelectorAll('.sent')];
  sentEls = sents; activeIdx = -1; adrift = false; firstJump = true;
  let active = -1;

  icon = () => { ppi.innerHTML = `<path d="${audio.paused ? PL : PA}"/>`;
                 pp.classList.toggle('playing', !audio.paused); };
  draw = () => {
    const dur = audio.duration || d.d || 1, t = audio.currentTime || 0;
    if (t > 0) lastT = t;
    const p = Math.min(1, t / dur);
    fill.style.width = (p*100) + '%'; knob.style.left = (p*100) + '%';
    pt.textContent = fmt(t) + ' / ' + fmt(dur);
    let k = -1;
    for (let i = 0; i < d.s.length; i++){ if (t + 0.25 >= d.s[i][0]) k = i; else break; }
    if (k !== active){
      if (sents[active]) sents[active].classList.remove('on');
      active = k;
      activeIdx = active;
      if (sents[active]){
        sents[active].classList.add('on');
        sents.forEach((el, i) => el.classList.toggle('done', i < active));
        keepVisible();
      }
    }
  };

  pp.onclick = () => { audio.paused ? audio.play().catch(()=>{}) : audio.pause(); icon(); };
  audio.ontimeupdate = draw; audio.onloadedmetadata = draw;
  audio.onplay = () => { adrift = false; showJump(false); icon(); };
  audio.onpause = icon;
  audio.onended = () => { if (n < b.c) location.hash = '#c/' + b.s + '/' + (n+1); };
  $('#flw').onclick = () => setFollow(!follow);
  setFollow(follow);
  $('#jump').onclick = () => { adrift = false; showJump(false); scrollToActive(true); };
  draw(); icon();

  body.querySelectorAll('[data-t]').forEach(el => el.onclick = () => {
    adrift = false; showJump(false);
    audio.currentTime = +el.dataset.t;
    audio.play().catch(()=>{}); icon(); draw();
  });
  body.querySelectorAll('[data-fav]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const i = +el.dataset.fav;
    let j = i + 1;                                  // run to the next verse number
    while (j < d.s.length && !d.s[j][2]) j++;
    const text = d.s.slice(i, j).map(r => r[1]).join(' ');
    el.classList.toggle('faved', toggleFav(b, n, d.s[i], text));
  });
  if (seekTo != null){
    const t = seekTo; seekTo = null;
    const go = () => { adrift = false; showJump(false); audio.currentTime = t;
                       audio.play().catch(() => {}); icon(); draw(); };
    if (audio.readyState > 0) go();
    else audio.addEventListener('loadedmetadata', go, {once: true});
  }
  app.querySelectorAll('[data-sk]').forEach(el => el.onclick = () => {
    audio.currentTime = Math.max(0, audio.currentTime + (+el.dataset.sk)); draw(); });
  app.querySelectorAll('[data-nav]').forEach(el => el.onclick = () => {
    location.hash = '#c/' + b.s + '/' + el.dataset.nav; });

  const rates = [1, 1.25, 1.5, 1.75, 2];
  let ri = rates.indexOf(audio.playbackRate); if (ri < 0) ri = 0;
  rate.textContent = rates[ri] + '×';
  rate.onclick = () => { ri = (ri+1) % rates.length; audio.playbackRate = rates[ri];
                         rate.textContent = rates[ri] + '×'; };

  const seek = e => { const r = bar.getBoundingClientRect();
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const p = Math.min(1, Math.max(0, (x - r.left) / r.width));
    audio.currentTime = p * (audio.duration || d.d); draw(); };
  let dragging = false;
  bar.addEventListener('pointerdown', e => { dragging = true; bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener('pointermove', e => { if (dragging) seek(e); });
  bar.addEventListener('pointerup', () => dragging = false);
}

function route(){
  const h = location.hash || '';
  window.scrollTo(0, 0);
  if (h.startsWith('#favs')) return favsView();
  const c = h.match(/^#c\/([^/]+)\/(\d+)(?:\/([\d.]+))?/);
  if (c) return chapter(c[1], c[2], c[3]);
  const b = h.match(/^#b\/(.+)/);
  if (b) return book(b[1]);
  books();
}
addEventListener('hashchange', route);
route();
</script></body></html>
